<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e5e8c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crab Dash" />
    <meta name="description" content="Crab Dash: a three-lane beach runner. Dodge sandcastles, hop waves, collect shells, unlock new crabs." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Crab Dash</title>
  </head>
  <body>
    <div id="app">
      <canvas id="gl" aria-label="Crab Dash game view"></canvas>
      <div id="vignette"></div>
      <div id="touch-layer"></div>
      <div id="ui"></div>
      <div id="loader">
        <div class="loader-logo">Crab Dash</div>
        <div class="crab-run" aria-hidden="true">
          <div class="track"><i></i></div>
          <div class="crab"><svg viewBox="0 0 52 40"><path d="M6 22c-5-3-6-10-1-13 1 4 4 6 7 6M46 22c5-3 6-10 1-13-1 4-4 6-7 6" fill="#e53935"/><g stroke="#b3261e" stroke-width="2.6" stroke-linecap="round"><path d="M14 28l-6 8M18 30l-3 8M34 30l3 8M38 28l6 8"/></g><ellipse cx="26" cy="25" rx="15" ry="10" fill="#e53935"/><ellipse cx="26" cy="29" rx="11" ry="5" fill="#ffc9a0"/><circle cx="20" cy="13" r="5" fill="#fff"/><circle cx="32" cy="13" r="5" fill="#fff"/><circle cx="21" cy="14" r="2.3" fill="#14141c"/><circle cx="33" cy="14" r="2.3" fill="#14141c"/></svg></div>
        </div>
        <div class="loader-tip">Waxing the surfboards…</div>
      </div>
      <noscript>Crab Dash needs JavaScript to run.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
